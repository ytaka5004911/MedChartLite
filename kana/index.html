<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedChart Lite - でんしカルテデモ</title>
  <link rel="stylesheet" href="style.css">
  <script src="keybord.js"></script>
  </head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

  <header class="topbar">
    <div>
      <div class="brand">MedChart <span>Lite</span></div>
      <small>でんしカルテ・デモシステム</small>
    </div>
    <div class="top-actions">
      <a href="https://ytaka5004911.github.io/ytaka5004911/index.html">ホームページにもどる</a>
      <button id="KeyboardSwitchingBtn">キーボードきりかえ</button>
      <p id="KeyboardSwitchingTxt"></p>
      <button id="newPatientBtn" class="primary">＋ しんきかんじゃ</button>
      <button id="exportBtn">バックアップかきだし</button>
      <label class="import-label">バックアップよみこみ<input id="importInput" type="file" accept=".json"></label>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <div class="search-wrap">
        <input id="patientSearch" placeholder="かんじゃめい・IDをけんさく">
      </div>
      <div class="side-title">かんじゃいちらん <span id="patientCount">0</span></div>
      <div id="patientList" class="patient-list"></div>
    </aside>

    <main class="main">
      <section id="emptyState" class="empty-state">
        <div class="empty-icon">＋</div>
        <h2>かんじゃをせんたくしてください</h2>
        <p>ひだりのかんじゃいちらんからえらぶか、「しんきかんじゃ」からとうろくできます。</p>
      </section>

      <section id="chart" class="chart hidden">
        <div class="patient-head">
          <div>
            <div class="patient-name-row">
              <h1 id="patientName"></h1>
              <span id="patientStatus" class="badge">つういんちゅう</span>
            </div>
            <div id="patientMeta" class="muted"></div>
          </div>
          <div class="patient-actions">
            <button id="editPatientBtn">かんじゃじょうほうをへんしゅう</button>
            <button id="deletePatientBtn" class="danger-outline">かんじゃさくじょ</button>
          </div>
        </div>

        <nav class="tabs">
          <button class="tab active" data-tab="overview">がいよう</button>
          <button class="tab" data-tab="records">しんりょうりれき</button>
          <button class="tab" data-tab="newRecord">しんりょうきろくにゅうりょく</button>
        </nav>

        <div id="tab-overview" class="tab-panel">
          <div class="grid two">
            <article class="card">
              <div class="card-title">きほんじょうほう</div>
              <dl class="info-grid" id="basicInfo"></dl>
            </article>
            <article class="card">
              <div class="card-title">さいしんバイタル</div>
              <div id="latestVitals" class="vitals"></div>
            </article>
          </div>
          <article class="card">
            <div class="card-title">さいしんのしんりょうきろく</div>
            <div id="latestRecord"></div>
          </article>
        </div>

        <div id="tab-records" class="tab-panel hidden">
          <div class="section-head">
            <div>
              <h2>しんりょうりれき</h2>
              <p class="muted">ほぞんされたしんりょうきろくをあたらしいじゅんにひょうじ</p>
            </div>
            <button class="primary" id="quickNewRecord">＋ しんりょうきろくをついか</button>
          </div>
          <div id="recordList"></div>
        </div>

        <div id="tab-newRecord" class="tab-panel hidden">
          <div class="section-head">
            <div>
              <h2>しんりょうきろくにゅうりょく</h2>
              <p class="muted">ほぞんするとりれきについかされます。</p>
            </div>
          </div>
          <form id="recordForm" class="form">
            <div class="grid three">
              <label>しんりょうび<input type="date" id="visitDate" required></label>
              <label>しんりょうか<input id="department" placeholder="れい：ないか"></label>
              <label>たんとうしゃ<input id="clinician" placeholder="れい：たんとうい"></label>
            </div>

            <div class="card form-card">
              <div class="card-title">バイタル</div>
              <div class="grid four">
                <label>たいおん（℃）<input type="number" step="0.1" id="temp"></label>
                <label>けつあつ・じょう<input type="number" id="bpSys"></label>
                <label>けつあつ・か<input type="number" id="bpDia"></label>
                <label>みゃくはく（/ふん）<input type="number" id="pulse"></label>
              </div>
            </div>

            <div class="grid two">
              <label>かんじゃがいっていること<textarea id="chiefComplaint" rows="3" placeholder="かんじゃがいっていること"></textarea></label>
              <label>げんびょうれき<textarea id="history" rows="3" placeholder=""></textarea></label>
              <label>じょうたい<textarea id="findings" rows="4" placeholder="じょうたい"></textarea></label>
              <label>けっか<textarea id="assessment" rows="4" placeholder="けっか"></textarea></label>
              <label>くすり<textarea id="plan" rows="4" placeholder="くすり"></textarea></label>
              <label>メモ<textarea id="note" rows="4" placeholder="メモ"></textarea></label>
            </div>

            <div class="form-actions">
              <button type="button" id="clearRecordBtn">にゅうりょくをクリア</button>
              <button type="submit" class="primary">しんりょうきろくをほぞん</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <dialog id="patientDialog">
    <form method="dialog" id="patientForm" class="dialog-form">
      <div class="dialog-head">
        <h2 id="patientDialogTitle">しんきかんじゃ</h2>
        <button type="button" class="icon-btn" data-close="patientDialog">×</button>
      </div>
      <div class="grid two">
        <label>ID<input id="pId" placeholder="じどうさいばんか"></label>
        <label>なまえ<input id="pName" required></label>
        <label>うまれたひ<input type="date" id="pBirth"></label>
        <label>せいべつ
          <select id="pSex"><option value="">みせんたく</option><option>だんせい</option><option>じょせい</option><option>そのた</option></select>
        </label>
        <label>でんわ<input id="pPhone" inputmode="tel"></label>
        <label>ステータス
          <select id="pStatus"><option>つういんちゅう</option><option>けいかかんさつ</option><option>しゅうりょう</option></select>
        </label>
      </div>
      <label>そのた<textarea id="pNote" rows="3"></textarea></label>
      <div class="form-actions">
        <button type="button" data-close="patientDialog">キャンセル</button>
        <button class="primary" type="submit">ほぞん</button>
      </div>
    </form>
  </dialog>

  <dialog id="recordDialog">
    <div class="dialog-form">
      <div class="dialog-head">
        <h2>しんりょうきろく</h2>
        <button type="button" class="icon-btn" data-close="recordDialog">×</button>
      </div>
      <div id="recordDetail"></div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
  <script>
    (function(){
    document.addEventListener("DOMContentLoaded", ()=>{
      create()
    const gojuonKeyboard = document.getElementById("gojuonKeyboard");
    
    gojuonKeyboard.style.display = "none";

const KeyboardSwitchingBtn = document.getElementById("KeyboardSwitchingBtn");
const KeyboardSwitchingTxt = document.getElementById("KeyboardSwitchingTxt");

KeyboardSwitchingBtn.addEventListener("click", ()=>{
  gojuonKeyboard.style.display =
    gojuonKeyboard.style.display == "none" ? "block" : "none";

  KeyboardSwitchingTxt.textContent =
    gojuonKeyboard.style.display == "none" ? "つうじょう" : "どくじ";
});   }); })();
  </script>
</body>
</html>
